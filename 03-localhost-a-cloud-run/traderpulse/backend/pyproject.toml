[project]
name = "traderpulse-api"
version = "2027.1.0"
description = "TraderPulse BFF (FastAPI) con contrato OpenAPI compartido con el frontend."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "google-genai>=2.34.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "httpx2>=2.16.0", "ruff>=0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["traderpulse_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
